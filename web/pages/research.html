<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<title>Delta Desk · Research</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@500;600&family=JetBrains+Mono:wght@300;400;500&display=swap">
<script>try{var t=localStorage.getItem('dd.theme');if(t==='dark')t='ink';if(t==='paper'||t==='midnight')t='mist';if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/static/css/design.css">
<style>
/* welcome: one line, the composer, three examples */
.hero{padding:34px 20px 22px;max-width:860px;margin:0 auto}
.hero h1{margin:0 0 18px;font:600 28px/1.15 var(--sans);letter-spacing:-.02em}
.ask{display:flex;gap:8px}
.ask input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--card);font-size:14px}
.ask .btn{padding:12px 20px;border-radius:10px;font-weight:600}
.ask .btn[disabled]{opacity:.5}
.err{min-height:16px;padding:6px 2px 0;font-size:11.5px;color:var(--bad)}
.ex{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:10px}
.ex button{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ex button:hover{border-color:var(--ink-3)}
.ex small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.ex b{display:block;margin-top:4px;font:600 13px/1.3 var(--sans)}
/* the run card */
.steps{display:flex;gap:6px;padding:12px 20px;border-bottom:1px solid var(--line)}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--fill-2)}
.steps i.on{background:var(--ink)}.steps i.now{background:var(--s1)}
.dec{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line)}
.dec div{padding:14px 20px;border-right:1px solid var(--line);min-width:0}
.dec div:last-child{border-right:0}
.dec small{display:block;font-size:11px;color:var(--ink-3)}
.dec b{display:block;margin-top:4px;font:600 22px/1.1 var(--sans);letter-spacing:-.02em;text-transform:capitalize}
.dec b.long{color:var(--good)}.dec b.avoid{color:var(--bad)}.dec b.wait{color:var(--warn)}
.st{display:inline-flex;align-items:center;gap:6px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.st.done::before{background:var(--good)}.st.failed::before{background:var(--bad)}
.st.running::before{background:var(--s1);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.st.running::before{animation:none}}
td.out{max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
td .role{display:block;font-size:11px;color:var(--ink-3)}
td.tool{white-space:nowrap;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
/* report: one fold per agent, tool calls first */
.rep details{border-bottom:1px solid var(--line)}
.rep summary{display:flex;gap:12px;align-items:baseline;padding:12px 20px;cursor:pointer;font:600 13.5px/1.3 var(--sans)}
.rep summary span{font:400 12px var(--sans);color:var(--ink-3);margin-left:auto;text-align:right}
.rep .body{padding:0 20px 16px;max-width:860px;font-size:13px;line-height:1.55}
.rep .body p{margin:12px 0 4px}.rep .body ul{margin:0;padding-left:18px}.rep .body li{margin:0 0 3px}
.calls{display:grid;grid-template-columns:auto auto 1fr;gap:4px 14px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--fill);font:400 11.5px var(--mono);color:var(--ink-2)}
.calls .ms{text-align:right;color:var(--ink-3)}.calls .bad{color:var(--bad)}
.past{display:flex;gap:8px;flex-wrap:wrap;padding:12px 20px}
.past button{display:inline-flex;gap:8px;align-items:center}
@media (max-width:760px){.hero{padding:22px 16px 16px}.hero h1{font-size:22px}.dec{grid-template-columns:repeat(2,1fr)}.dec div{border-bottom:1px solid var(--line)}.calls{grid-template-columns:1fr auto}.calls .pv{grid-column:1/-1;color:var(--ink-3)}.rep summary{flex-wrap:wrap}.rep summary span{margin-left:0;text-align:left}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span aria-hidden="true">✢</span><b>Delta Desk</b><span class="tag">RESEARCH</span></div>
  <nav class="nav"><a href="/">Home</a><a href="/watchlist">Watchlist</a><a href="/heatmap">Heatmap</a><a href="/news">News</a><a href="/desk">Agents</a><a href="/research" aria-current="page">Research</a><a href="/sniper">Sniper</a></nav>
  <div class="status"><span class="clock num" id="clock">—</span></div>
</div></header>

<main class="wrap">
<div class="ticker" id="ticker"><span class="src">loading indices…</span></div>

<section>
  <div class="hero">
    <h1>What should the team research?</h1>
    <form class="ask" id="ask"><input id="q" placeholder="A stock: HDFCBANK, Reliance, Titan…" autocomplete="off" aria-label="Stock to research"><button class="btn primary" id="go" type="submit">Run</button></form>
    <div class="err" id="err" role="alert"></div>
    <div class="ex" id="ex"></div>
  </div>
</section>

<section id="run" hidden>
  <div class="sec-head"><h2 id="rTitle">—</h2><span class="meta" id="rMeta">—</span></div>
  <div class="steps" id="steps" title="Rounds: bull and bear research, risk review, final call"></div>
  <div class="dec" id="dec" hidden></div>
  <div class="tbl-wrap flush"><table>
    <thead><tr><th>Agent</th><th>Status</th><th>Tool</th><th class="num">Time</th><th>Output</th></tr></thead>
    <tbody id="agents"></tbody>
  </table></div>
  <div class="rep" id="rep"></div>
</section>

<section id="pastSec" hidden>
  <div class="sec-head"><h2>Recent runs</h2><span class="meta" id="model" title="Every number in a decision is computed by rules; a language model, when a key is set, only writes the prose.">—</span></div>
  <div class="past" id="past"></div>
</section>
</main>
<footer><div class="wrap"></div></footer>

<script src="/static/js/common.js"></script>
<script src="/static/js/ui.js"></script>
<script src="/static/js/nav.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var esc=DD.esc,get=DD.get;
  DD.boot();
  var run=null,timer=null,busy=false,openSet={};
  var TIP={bull_advocate:'Builds the long case from technicals, filings and the wire.',bear_advocate:'Builds the risk case; VaR, CVaR and drawdown are computed from a year of daily bars.',
    risk_officer:'Scores both cases, sets the size cap and the stop. Independent of both researchers.',portfolio_manager:'Rules on the debate: long, wait or avoid, with a confidence.'};
  function post(u,body){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.detail||r.status);return j})})}
  function secs(s){if(s==null)return '—';return s<60?(s<10?s.toFixed(1):Math.round(s))+'s':Math.floor(s/60)+'m '+Math.round(s%60)+'s'}
  function sign(v,d){return (v>0?'+':'')+Number(v).toFixed(d==null?1:d)}
  /* markdown-lite: **label** lines, bullets, paragraphs */
  function md(text){var out=[],items=[];function flush(){if(items.length){out.push('<ul>'+items.join('')+'</ul>');items=[]}}
    function inline(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')}
    String(text||'').split(/\r?\n/).forEach(function(l){if(/^\s*[-*•]\s+/.test(l)){items.push('<li>'+inline(l.replace(/^\s*[-*•]\s+/,''))+'</li>')}else if(l.trim()){flush();out.push('<p>'+inline(l.replace(/^#+\s*/,''))+'</p>')}});
    flush();return out.join('')}

  function render(){var r=run;if(!r)return;$('#run').hidden=false;
    $('#rTitle').innerHTML=esc(r.title)+' · <a href="/analysis#'+encodeURIComponent(r.target)+'/3m/fundamental" style="text-decoration:underline">'+esc(r.target)+'</a> · '+esc(r.name);
    $('#rMeta').textContent=r.status+' · '+r.done+'/'+r.agents.length+' agents · round '+Math.max(1,r.round)+' of '+r.rounds+' · '+secs(r.elapsed_s)+(r.error?' · '+r.error:'');
    var s='';for(var i=1;i<=r.rounds;i++){s+='<i class="'+(r.status==='completed'||i<r.round?'on':i===r.round?'now':'')+'"></i>'}$('#steps').innerHTML=s;
    var d=r.decision;$('#dec').hidden=!d;
    if(d){$('#dec').innerHTML='<div title="Bull score '+d.bull_score+' against bear score '+d.bear_score+'. A long needs +2 or better."><small>Decision</small><b class="'+esc(d.action)+'">'+esc(d.action)+'</b></div>'+
      '<div title="Rules v0, not calibrated against outcomes yet."><small>Confidence</small><b class="num">'+d.confidence+' %</b></div>'+
      '<div title="Sized so a stop-out costs about 1 % of the portfolio, capped at 10 %."><small>Size cap</small><b class="num">'+Number(d.size_pct).toFixed(1)+' %</b></div>'+
      '<div title="The larger of 5 % and a 10-session 95 % move."><small>Stop</small><b class="num">'+sign(d.stop_pct)+' %</b></div>'+
      '<div title="Twice the stop distance, over '+esc(d.horizon)+'."><small>Target</small><b class="num">'+sign(d.target_pct)+' %</b></div>'}
    $('#agents').innerHTML=r.agents.map(function(a){return '<tr title="'+esc(TIP[a.id]||'')+'"><td><b>'+esc(a.id)+'</b><span class="role">'+esc(a.role)+'</span></td><td><span class="st '+esc(a.status)+'">'+esc(a.status)+'</span></td><td class="tool">'+esc(a.tool||(a.steps.length?a.steps.length+' calls':'—'))+'</td><td class="num">'+secs(a.elapsed_s)+'</td><td class="out'+(a.error?' dn':'')+'" title="'+esc(a.output)+'">'+esc(a.output||'—')+'</td></tr>'}).join('');
    var order=r.agents.slice().reverse();
    $('#rep').innerHTML=order.filter(function(a){return a.report||a.steps.length}).map(function(a,i){var open=!!openSet[a.id];
      return '<details data-a="'+esc(a.id)+'"'+(open?' open':'')+'><summary>'+esc(a.role)+'<span>'+esc(a.output)+'</span></summary><div class="body"><div class="calls">'+a.steps.map(function(t){return '<span'+(t.status==='error'?' class="bad"':'')+'>'+esc(t.tool)+'</span><span class="ms">'+(t.elapsed_ms==null?'…':t.elapsed_ms+' ms')+'</span><span class="pv">'+esc(t.preview)+'</span>'}).join('')+'</div>'+md(a.report)+'</div></details>'}).join('')}
  $('#rep').addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.a)openSet[d.dataset.a]=d.open},true);

  function poll(){clearTimeout(timer);if(!run)return;get('/research/run/'+run.id).then(function(r){run=r;render();if(r.status==='running'||r.status==='pending'){timer=setTimeout(poll,1500)}else{history()}}).catch(function(){timer=setTimeout(poll,3000)})}
  function show(r){run=r;openSet={};try{window.history.replaceState(null,'','#'+r.id)}catch(e){}render();poll()}
  function start(query){query=(query||'').trim();if(!query||busy)return;busy=true;$('#go').disabled=true;$('#err').textContent='';
    post('/research/run',{query:query,preset:'investment_committee'}).then(show).catch(function(e){$('#err').textContent=String(e.message||e)}).then(function(){busy=false;$('#go').disabled=false})}
  function history(){get('/research/runs').then(function(rows){$('#pastSec').hidden=!rows.length;
    $('#past').innerHTML=rows.map(function(x){return '<button class="btn" data-id="'+esc(x.id)+'"><b>'+esc(x.target)+'</b>'+(x.action?'<span class="'+(x.action==='long'?'up':x.action==='avoid'?'dn':'muted')+'">'+esc(x.action)+' '+x.confidence+' %</span>':'<span class="muted">'+esc(x.status)+'</span>')+'</button>'}).join('')}).catch(function(){})}

  $('#ask').addEventListener('submit',function(e){e.preventDefault();start($('#q').value)});
  $('#ex').addEventListener('click',function(e){var b=e.target.closest('button[data-q]');if(b){$('#q').value=b.dataset.q;start(b.dataset.q)}});
  $('#past').addEventListener('click',function(e){var b=e.target.closest('button[data-id]');if(b)get('/research/run/'+b.dataset.id).then(show).catch(function(){})});
  get('/research/presets').then(function(p){$('#model').textContent=p.model;
    $('#ex').innerHTML=p.examples.map(function(x){return '<button type="button" data-q="'+esc(x.query)+'" title="'+esc(x.desc)+'"><b>'+esc(x.title)+'</b></button>'}).join('')}).catch(function(){});
  var id=(location.hash||'').slice(1);if(/^[a-f0-9]{12}$/.test(id))get('/research/run/'+id).then(show).catch(function(){});
  history();
  DD.ticker({endpoint:'/markets/indices',order:['NIFTY50','BANKNIFTY','FINNIFTY','SENSEX','INDIAVIX'],every:10000});
})();
</script>
</body>
</html>
