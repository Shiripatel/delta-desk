[project]
license = { text = "All rights reserved (source-available, see LICENSE)" }
name = "deltadesk"
version = "0.1.0"
description = "Sniper-style agentic F&O trading desk for NSE (paper mode first)."
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "tzdata>=2024.1",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
kite = ["kiteconnect>=5.0"]
upstox = ["upstox-python-sdk>=2.0", "protobuf>=4"]
dhan = ["dhanhq>=2.0"]

[project.scripts]
deltadesk = "deltadesk.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deltadesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E741", "B008", "B023", "UP042"]
