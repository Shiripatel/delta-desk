# Delta Desk on one VM: the app container plus Caddy for HTTPS.
# Usage (on the VM, from /opt/delta-desk):  docker compose -f deploy/oracle/docker-compose.yml up -d --build
services:
  app:
    build:
      context: ../..
    restart: unless-stopped
    env_file: ../../.env
    environment:
      PORT: "8000"
    volumes:
      - ../../data:/app/data        # watchlists, waitlist, alerts, caches, traffic log survive rebuilds
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=5).status==200 else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}   # e.g. desk.example.com once a domain points here; ":80" serves plain http on the IP
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
